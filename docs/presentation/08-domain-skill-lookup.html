<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain skill lookup</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:  #f5f5f5;
    --color-ink:    #2d3142;
    --color-muted:  #4f5d75;
    --color-accent: #eb6c36;
    --font-sans:  'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono:  'Geist Mono', ui-monospace, monospace;
  }
  body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
  .frame { max-width: 900px; width: 100%; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
  h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.9rem); font-weight: 400;
    letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 0.5rem; }
  h1 { margin-bottom: 1rem; }
  svg { width: 100%; min-width: 700px; display: block; }
</style>
</head>
<body>
<div class="frame">
  <h1>Domain skill lookup — picking the right knowledge pack</h1>

  <svg viewBox="0 0 840 740" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="lookup-title lookup-desc">
    <title id="lookup-title">Domain skill catalogue lookup flow</title>
    <desc id="lookup-desc">Flowchart showing the agent running a domain skill catalogue script that reads
    a registry, opening the front of each listed skill to extract its description, checking for a missing
    or undocumented skill which fails loudly, and otherwise checking whether one shortlisted skill matches
    the story, using it if so or telling the developer plainly that none fits.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- Arrows -->
    <path d="M 400,96 V 140" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 400,196 V 240" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 400,296 V 340" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 400,396 V 420" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <path d="M 500,460 H 560" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="510" y="446" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="530" y="455" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

    <path d="M 400,500 V 540" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="410" y="498" width="132" height="12" rx="2" fill="#f5f5f5"/>
    <text x="476" y="507" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">NO: SHORTLIST READY</text>

    <path d="M 500,580 H 560" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="510" y="566" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="530" y="575" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>

    <path d="M 400,620 V 660" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="380" y="632" width="36" height="12" rx="2" fill="#f5f5f5"/>
    <text x="398" y="641" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

    <!-- Nodes -->
    <!-- Start -->
    <rect x="300" y="40" width="200" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="400" y="65" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent needs a</text>
    <text x="400" y="80" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">domain skill</text>

    <!-- Run -->
    <rect x="300" y="140" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run catalogue script</text>
    <text x="400" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Get-EiDomainSkillCatalog.ps1</text>

    <!-- Reg cylinder -->
    <path d="M 320,248 V 280 Q 400,290 480,280 V 248" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <ellipse cx="400" cy="248" rx="80" ry="10" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="400" y="270" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">domain-skill-registry.json</text>

    <!-- Loop+Extract -->
    <rect x="300" y="340" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read each skill's front</text>
    <text x="400" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">description + When to Use</text>

    <!-- Miss diamond -->
    <polygon points="400,420 500,460 400,500 300,460" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="456" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Missing or no</text>
    <text x="400" y="469" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">description?</text>

    <!-- Fail end -->
    <rect x="560" y="432" width="200" height="56" rx="28" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="660" y="457" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fail loudly</text>
    <text x="660" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">names the file to fix</text>

    <!-- Pick diamond -->
    <polygon points="400,540 500,580 400,620 300,580" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="400" y="576" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Does one match</text>
    <text x="400" y="589" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">the story?</text>

    <!-- Use end -->
    <rect x="560" y="552" width="200" height="56" rx="28" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="660" y="577" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Use that domain id</text>
    <text x="660" y="592" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">never invent one</text>

    <!-- None end -->
    <rect x="300" y="660" width="200" height="56" rx="28" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="400" y="685" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tell developer: none fits</text>
    <text x="400" y="700" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">offer proceed or stop</text>

    <!-- Legend -->
    <line x1="30" y1="722" x2="810" y2="722" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="30" y="738" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <polygon points="140,726 155,734 140,742 125,734" fill="#ffffff" stroke="#2d3142"/>
    <text x="165" y="737" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">decision</text>
    <rect x="290" y="728" width="16" height="12" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
    <text x="316" y="737" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">end: skill found</text>
    <rect x="470" y="728" width="16" height="12" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75"/>
    <text x="496" y="737" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">end: stopped / no match</text>
  </svg>

</div>
</body>
</html>
